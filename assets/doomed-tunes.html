<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOMED TUNES®</title>
<style>
body{margin:0;padding:24px;background:#111b2b;color:#f4f3ef;font:14px Arial}
#player{max-width:700px;margin:auto}
button{padding:12px;background:none;color:inherit;border:1px solid #ffffff33;cursor:pointer}
button.active{color:#b8a0ff;border-color:#b8a0ff}
#tracks{margin-top:16px}
.track{display:flex;width:100%;gap:14px;text-align:left;border-width:0 0 1px;padding:14px 4px}
.track span:nth-child(2){flex:1}
.track.current{color:#b8a0ff}
iframe{position:absolute;width:1px;height:1px;left:-9999px}
</style>
</head>
<body>
<div id="player">
<h2>DOOMED TUNES®</h2>
<div>
<button id="play">PLAY</button>
<button id="shuffle">SHUFFLE OFF</button>
<input id="volume" type="range" min="0" max="100" value="80">
</div>
<div id="tracks"></div>
</div>
<iframe id="sc" allow="autoplay"></iframe>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(async()=>{
const $=id=>document.getElementById(id);
const url="https://soundcloud.com/ojeexash/sets/doomed-tunes-fm";
const endpoint="https://soundcloud.com/oembed?format=json&url="+encodeURIComponent(url);
const response=await fetch(endpoint);
if(!response.ok)throw Error("Playlist unavailable");
const data=await response.json();
const doc=new DOMParser().parseFromString(data.html,"text/html");
const source=doc.querySelector("iframe");
if(!source)throw Error("Playlist embed unavailable");
$("sc").src=source.src+"&auto_play=false&visual=false";
const p=SC.Widget($("sc")),E=SC.Widget.Events;
let tracks=[],index=0,shuffle=false,bag=[];
function render(){
$("tracks").replaceChildren();
tracks.forEach((t,i)=>{
const b=document.createElement("button");b.className="track"+(i===index?" current":"");
const n=document.createElement("span");n.textContent=String(i+1).padStart(2,"0");
const name=document.createElement("span");name.textContent=t.title;
b.append(n,name);b.onclick=()=>play(i);$("tracks").append(b);
});
}
function refill(){
bag=tracks.map((_,i)=>i).filter(i=>i!==index);
for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
}
function play(i){
index=i;p.skip(i);p.seekTo(0);p.play();render();
}
function next(){
if(!tracks.length)return;
if(shuffle&&!bag.length)refill();
play(shuffle?bag.pop():(index+1)%tracks.length);
}
p.bind(E.READY,()=>{
p.getSounds(sounds=>{
tracks=sounds||[];
render();refill();p.setVolume(+$("volume").value);
});
});
p.bind(E.FINISH,()=>{if(shuffle)next();});
p.bind(E.PLAY,()=>$("play").textContent="PAUSE");
p.bind(E.PAUSE,()=>$("play").textContent="PLAY");
$("play").onclick=()=>p.toggle();
$("shuffle").onclick=()=>{
shuffle=!shuffle;$("shuffle").textContent=shuffle?"SHUFFLE ON":"SHUFFLE OFF";
if(shuffle)refill();
};
$("volume").oninput=e=>p.setVolume(+e.target.value);
})();
</script>
</body>
</html>
