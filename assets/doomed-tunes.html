<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOMED TUNES®</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111b2b;color:#f4f3ef;font:14px Arial}
#app{max-width:900px;margin:auto;padding:24px}
header,.controls,.track{display:flex;align-items:center;gap:14px}
header{justify-content:space-between;border-bottom:1px solid #ffffff22;padding-bottom:18px}
h1{font-size:25px;margin:0}h1 span{color:#b8a0ff}
input{accent-color:#b8a0ff;width:100px}
main{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding-top:24px}
#art{width:100%;aspect-ratio:1;background:#18263a;display:grid;place-items:center;color:#b8a0ff;font-size:60px;font-weight:bold}
#art img{width:100%;height:100%;object-fit:cover}
h2{font-size:18px;margin:18px 0 6px}
small{color:#8994a5}
.controls{margin-top:22px}
button{background:none;color:#f4f3ef;border:1px solid #ffffff33;padding:12px;cursor:pointer}
button.active,button:hover{color:#b8a0ff;border-color:#b8a0ff}
#play{background:#b8a0ff;color:#111b2b}
#tracks{margin-top:14px;max-height:420px;overflow:auto}
.track{width:100%;padding:13px 5px;border:0;border-bottom:1px solid #ffffff22;text-align:left}
.track span:nth-child(2){flex:1}
.track.current{color:#b8a0ff}
iframe{position:absolute;width:1px;height:1px;left:-9999px}
@media(max-width:600px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
<header>
  <div><h1>DOOMED <span>TUNES®</span></h1><small>VN RECORDS® / SELECTION</small></div>
  <input id="volume" type="range" min="0" max="100" value="80">
</header>
<main>
<section>
  <div id="art">DT®</div>
  <h2 id="title">DOOMED TUNES</h2>
  <small id="artist">SoundCloud Playlist</small>
  <div class="controls">
    <button id="prev">◀</button>
    <button id="play">▶</button>
    <button id="next">▶|</button>
    <button id="shuffle">⤨</button>
  </div>
</section>
<section>
  <h3>TRACKLIST <small id="count"></small></h3>
  <div id="tracks"></div>
</section>
</main>
</div>
<iframe id="sc" allow="autoplay"></iframe>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(() => {
const $=id=>document.getElementById(id);
const url="https://soundcloud.com/ojeexash/sets/doomed-tunes-fm";
const frame=$("sc");
frame.src="https://w.soundcloud.com/player/?url="+encodeURIComponent(url)+"&auto_play=false&visual=false";
const p=SC.Widget(frame), E=SC.Widget.Events;
let tracks=[],current=0,bag=[],shuffle=false,ready=false,pending=null;

function render(){
  $("count").textContent=tracks.length+" TRACKS";
  $("tracks").replaceChildren();
  tracks.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="track"+(i===current?" current":"");
    const n=document.createElement("span");n.textContent=String(i+1).padStart(2,"0");
    const name=document.createElement("span");name.textContent=t.title||"";
    b.append(n,name);
    b.onclick=()=>play(i);
    $("tracks").append(b);
  });
}
function show(t,i){
  if(!t)return;
  current=i;
  $("title").textContent=t.title||"DOOMED TUNES";
  $("artist").textContent=t.user?.username||"";
  $("art").replaceChildren();
  if(t.artwork_url){
    const img=document.createElement("img");
    img.src=t.artwork_url.replace("-large","-t500x500");
    $("art").append(img);
  }else $("art").textContent="DT®";
  render();
}
function play(i){
  if(!ready||!tracks[i])return;
  current=i;pending=i;render();
  p.skip(i);p.play();
}
function refill(){
  bag=tracks.map((_,i)=>i).filter(i=>i!==current);
  for(let i=bag.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [bag[i],bag[j]]=[bag[j],bag[i]];
  }
}
function next(){
  if(!tracks.length)return;
  if(shuffle){if(!bag.length)refill();play(bag.pop());}
  else play((current+1)%tracks.length);
}
async function completeMetadata(t){
  if(t.title||!t.permalink_url)return t;
  try{
    const r=await fetch("https://soundcloud.com/oembed?format=json&url="+encodeURIComponent(t.permalink_url));
    if(r.ok){
      const d=await r.json();
      return {...t,title:d.title||t.title,user:{...t.user,username:d.author_name||t.user?.username}};
    }
  }catch(e){}
  return t;
}
p.bind(E.READY,()=>{
  p.getSounds(async sounds=>{
    if(!Array.isArray(sounds)||!sounds.length)return;
    tracks=await Promise.all(sounds.map(completeMetadata));
    tracks=tracks.filter(t=>t.title);
    if(!tracks.length)return;
    ready=true;current=0;render();show(tracks[0],0);
    p.setVolume(+$("volume").value);
    refill();
  });
});
p.bind(E.PLAY,()=>{
  $("play").textContent="Ⅱ";
  p.getCurrentSoundIndex(i=>p.getCurrentSound(t=>{
    if(pending!==null&&i===pending){pending=null;p.seekTo(0);}
    show(t,i);
  }));
});
p.bind(E.PAUSE,()=>$("play").textContent="▶");
p.bind(E.FINISH",()=>{if(shuffle)next();});
$("play").onclick=()=>ready&&p.toggle();
$("next").onclick=next;
$("prev").onclick=()=>play((current-1+tracks.length)%tracks.length);
$("shuffle").onclick=()=>{
  shuffle=!shuffle;
  $("shuffle").classList.toggle("active",shuffle);
  if(shuffle)refill();
};
$("volume").oninput=e=>ready&&p.setVolume(+e.target.value);
})();
</script>
</body>
</html>
