<html lang="en">

<title>DOOMED TUNES® powered by OjeeXa$h</title>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicPlaylist",
  "name": "DOOMED TUNES® powered by OjeeXa$h",
  "description": "A music selection powered by Ojee Ka$h and VN RECORDS.",
  "url": "https://ojeexash.github.io/#doomed-tunes",
  "sameAs": "https://soundcloud.com/ojeexash/sets/doomed-tunes-fm",
  "creator": {
    "@type": "Person",
    "name": "Ojee Ka$h",
    "url": "https://ojeexash.github.io/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "VN RECORDS"
  }
}
</script>

<style>
:root {
  --bg:#111b2b;
  --panel:#18263a;
  --text:#f4f3ef;
  --muted:#8994a5;
  --accent:#b8a0ff;
  --line:rgba(255,255,255,.13);
}
* { box-sizing:border-box; }
body {
  margin:0;
  padding:0;
  background:transparent;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button { font:inherit; }
.doomed {
  width:100%;
  max-width:1000px;
  margin:0 auto;
  padding:34px;
  background:var(--bg);
  border:1px solid var(--line);
}
.header {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  padding-bottom:25px;
  border-bottom:1px solid var(--line);
}
.eyebrow {
  margin:0 0 12px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:.25em;
  text-transform:uppercase;
}
.heading {
  margin:0;
  font-size:clamp(28px,5vw,48px);
  font-weight:900;
  letter-spacing:-.055em;
  line-height:1;
}
.heading span { color:var(--accent); }
.subheading {
  margin:9px 0 0;
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  letter-spacing:.2em;
  line-height:1.4;
}
.volume-wrap {
  display:flex;
  align-items:center;
  justify-content:flex-end;
  min-width:90px;
  padding-top:8px;
}
.volume-control {
  width:100px;
  max-width:100%;
  height:4px;
  margin:0;
  accent-color:var(--accent);
  cursor:pointer;
}
.main {
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);
  gap:30px;
  padding-top:28px;
}
.now-playing {
  display:flex;
  flex-direction:column;
  min-width:0;
}
.artwork {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  aspect-ratio:1;
  overflow:hidden;
  background:var(--panel);
  border:1px solid var(--line);
}
.artwork img {
  width:100%;
  height:100%;
  object-fit:cover;
}
.artwork-placeholder {
  color:var(--accent);
  font-size:clamp(42px,9vw,90px);
  font-weight:900;
  letter-spacing:-.1em;
}
.track-info { padding:22px 0 15px; }
.track-status {
  margin-bottom:9px;
  color:var(--accent);
  font-size:9px;
  font-weight:800;
  letter-spacing:.2em;
  text-transform:uppercase;
}
.track-title {
  margin:0;
  overflow-wrap:anywhere;
  font-size:clamp(19px,3vw,26px);
  font-weight:800;
  letter-spacing:-.035em;
}
.track-artist {
  margin:8px 0 0;
  color:var(--muted);
  font-size:12px;
}
.track-artist:empty { display:none; }
.controls {
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:auto;
  padding-top:18px;
}
.control {
  display:flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  padding:0;
  color:var(--text);
  background:transparent;
  border:1px solid var(--line);
  cursor:pointer;
  transition:.2s ease;
}
.control:hover,.control.active {
  color:var(--accent);
  border-color:var(--accent);
}
.control.play {
  width:50px;
  height:50px;
  color:var(--bg);
  background:var(--accent);
  border-color:var(--accent);
  font-size:18px;
}
.control.play:hover { opacity:.85; }
.control.shuffle {
  margin-left:auto;
  font-size:17px;
}
.control svg {
  width:17px;
  height:17px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.playlist { min-width:0; }
.playlist-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding-bottom:15px;
  border-bottom:1px solid var(--line);
}
.playlist-heading {
  margin:0;
  font-size:12px;
  font-weight:800;
  letter-spacing:.15em;
  text-transform:uppercase;
}
.track-count {
  color:var(--muted);
  font-size:10px;
  letter-spacing:.1em;
}
.track-list {
  max-height:390px;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--muted) transparent;
}
.track-item {
  display:grid;
  grid-template-columns:27px minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  width:100%;
  padding:14px 4px;
  color:var(--text);
  text-align:left;
  background:transparent;
  border:0;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.track-item:hover,.track-item.current {
  background:rgba(255,255,255,.045);
}
.track-number {
  color:var(--muted);
  font-size:10px;
  text-align:center;
}
.track-item.current .track-number { color:var(--accent); }
.track-details { min-width:0; }
.track-name {
  display:block;
  overflow:hidden;
  font-size:12px;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.track-user {
  display:block;
  margin-top:5px;
  overflow:hidden;
  color:var(--muted);
  font-size:10px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.track-user:empty { display:none; }
.track-duration {
  color:var(--muted);
  font-size:10px;
  font-variant-numeric:tabular-nums;
}
.message {
  padding:25px 5px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}
.footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  margin-top:26px;
  padding-top:18px;
  border-top:1px solid var(--line);
}
.footer-note {
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:.16em;
}
.share-actions {
  display:flex;
  align-items:center;
  gap:8px;
}
.share-button {
  padding:9px 12px;
  color:var(--text);
  background:transparent;
  border:1px solid var(--line);
  font-size:9px;
  font-weight:800;
  letter-spacing:.1em;
  cursor:pointer;
  transition:.2s ease;
}
.share-button:hover {
  color:var(--accent);
  border-color:var(--accent);
}
.soundcloud-source {
  position:absolute;
  width:1px;
  height:1px;
  left:-10000px;
  top:0;
  opacity:0;
  pointer-events:none;
}
@media(max-width:650px) {
  .doomed { padding:22px 17px; }
  .header { gap:10px; }
  .volume-wrap { min-width:65px; padding-top:6px; }
  .volume-control { width:72px; }
  .main { grid-template-columns:1fr; gap:30px; }
  .artwork { max-width:360px; margin:0 auto; }
  .track-list { max-height:340px; }
  .footer { align-items:flex-start; }
}
</style>
</head>

<body>
<section class="doomed" id="doomed-tunes">
  <header class="header">
    <div>
      <p class="eyebrow">VN RECORDS® / SELECTION</p>
      <h1 class="heading">DOOMED <span>TUNES</span></h1>
      <p class="subheading">SHUFFLE / PLAY</p>
    </div>
    <div class="volume-wrap">
      <input class="volume-control" id="volume" type="range" min="0" max="100" value="80" aria-label="Sound level" title="Sound level">
    </div>
  </header>

  <div class="main">
    <section class="now-playing">
      <div class="artwork" id="artwork">
        <div class="artwork-placeholder">DT®</div>
      </div>
      <div class="track-info">
        <div class="track-status" id="track-status">READY TO PLAY</div>
        <h2 class="track-title" id="track-title">DOOMED TUNES</h2>
        <p class="track-artist" id="track-artist"></p>
      </div>
      <div class="controls">
        <button class="control" id="previous" aria-label="Previous track">
          <svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16Z"/><path d="M5 19V5"/></svg>
        </button>
        <button class="control play" id="play" aria-label="Play">▶</button>
        <button class="control" id="next" aria-label="Next track">
          <svg viewBox="0 0 24 24"><path d="m5 4 10 8-10 8V4Z"/><path d="M19 5v14"/></svg>
        </button>
        <button class="control shuffle" id="shuffle" aria-label="Toggle shuffle" aria-pressed="false" title="Shuffle">
          <svg viewBox="0 0 24 24">
            <path d="m16 3 4 4-4 4"/>
            <path d="M4 17h2.5a5 5 0 0 0 4-2l3-4a5 5 0 0 1 4-2H20"/>
            <path d="m16 13 4 4-4 4"/>
            <path d="M4 7h2.5a5 5 0 0 1 3.5 1.5"/>
            <path d="M14 16a5 5 0 0 0 2.5 1H20"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="playlist">
      <div class="playlist-header">
        <h2 class="playlist-heading">TRACKLIST</h2>
        <span class="track-count" id="track-count">LOADING</span>
      </div>
      <div class="track-list" id="track-list">
        <div class="message">Connecting to SoundCloud...</div>
      </div>
    </section>
  </div>

  <footer class="footer">
    <div class="footer-note">DOOMED TUNES® / VN RECORDS</div>
    <div class="share-actions">
      <button class="share-button" id="share-playlist">SHARE PLAYLIST</button>
      <button class="share-button" id="share-track">SHARE TRACK</button>
    </div>
  </footer>
</section>

<iframe id="soundcloud-player" class="soundcloud-source" title="DOOMED TUNES SoundCloud Player" allow="autoplay" scrolling="no" frameborder="0"></iframe>
<script src="https://w.soundcloud.com/player/api.js"></script>

<script>
const PLAYLIST_URL = "https://soundcloud.com/ojeexash/sets/doomed-tunes-fm";
const SHARE_URL = "https://ojeexash.github.io/#doomed-tunes";

const iframe = document.getElementById("soundcloud-player");
const titleEl = document.getElementById("track-title");
const artistEl = document.getElementById("track-artist");
const statusEl = document.getElementById("track-status");
const artworkEl = document.getElementById("artwork");
const listEl = document.getElementById("track-list");
const countEl = document.getElementById("track-count");
const playBtn = document.getElementById("play");
const shuffleBtn = document.getElementById("shuffle");
const volumeEl = document.getElementById("volume");

const embedURL = "https://w.soundcloud.com/player/?" +
  "url=" + encodeURIComponent(PLAYLIST_URL) +
  "&auto_play=false&hide_related=true&show_comments=false" +
  "&show_user=true&show_reposts=false&visual=false";

let widget;
let sounds = [];
let currentIndex = -1;
let shuffleEnabled = false;
let isPlaying = false;
let playRequest = 0;

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

function widgetCall(method) {
  return new Promise(resolve => widget[method](resolve));
}

function formatDuration(ms) {
  const seconds = Math.floor((ms || 0) / 1000);
  return Math.floor(seconds / 60) + ":" +
    String(seconds % 60).padStart(2, "0");
}

function artworkURL(sound) {
  return sound && sound.artwork_url
    ? sound.artwork_url.replace("-large", "-t500x500")
    : "";
}

function showMessage(message) {
  listEl.textContent = "";
  const el = document.createElement("div");
  el.className = "message";
  el.textContent = message;
  listEl.appendChild(el);
}

function updatePlayButton(playing) {
  isPlaying = playing;
  playBtn.textContent = playing ? "Ⅱ" : "▶";
  playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
}

function renderTracklist() {
  if (!sounds.length) {
    showMessage("No tracks found in this playlist.");
    countEl.textContent = "EMPTY";
    return;
  }

  countEl.textContent = String(sounds.length).padStart(2, "0") + " TRACKS";
  listEl.textContent = "";

  sounds.forEach((sound, index) => {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "track-item" +
      (index === currentIndex ? " current" : "");

    const number = document.createElement("span");
    number.className = "track-number";
    number.textContent = String(index + 1).padStart(2, "0");

    const details = document.createElement("span");
    details.className = "track-details";

    const name = document.createElement("span");
    name.className = "track-name";
    name.textContent = sound.title || "Untitled track";

    const artist = document.createElement("span");
    artist.className = "track-user";
    artist.textContent = sound.user?.username || "";

    details.append(name, artist);

    const duration = document.createElement("span");
    duration.className = "track-duration";
    duration.textContent = formatDuration(sound.duration);

    item.append(number, details, duration);
    item.addEventListener("click", () => playTrack(index));
    listEl.appendChild(item);
  });
}

function updateCurrentTrack(sound) {
  if (!sound) return;

  const index = sounds.findIndex(
    track => String(track.id) === String(sound.id)
  );

  if (index !== -1) {
    sounds[index] = { ...sounds[index], ...sound };
    currentIndex = index;
  }

  titleEl.textContent = sound.title || "DOOMED TUNES";
  artistEl.textContent = sound.user?.username || "";
  statusEl.textContent = "NOW PLAYING";

  artworkEl.textContent = "";
  const art = artworkURL(sound);

  if (art) {
    const img = document.createElement("img");
    img.src = art;
    img.alt = (sound.title || "Track") + " artwork";
    artworkEl.appendChild(img);
  } else {
    const placeholder = document.createElement("div");
    placeholder.className = "artwork-placeholder";
    placeholder.textContent = "DT®";
    artworkEl.appendChild(placeholder);
  }

  renderTracklist();
}

function randomIndex() {
  if (sounds.length < 2) return currentIndex;

  let index;
  do {
    index = Math.floor(Math.random() * sounds.length);
  } while (index === currentIndex);

  return index;
}

async function playTrack(index) {
  if (!widget || index < 0 || index >= sounds.length) return;

  const request = ++playRequest;
  currentIndex = index;
  renderTracklist();

  widget.pause();
  widget.skip(index);

  for (let attempt = 0; attempt < 50; attempt++) {
    if (request !== playRequest) return;

    const actualIndex = await widgetCall("getCurrentSoundIndex");

    if (Number(actualIndex) === index) break;
    await wait(50);
  }

  if (request !== playRequest) return;

  widget.seekTo(0);
  await wait(150);

  if (request !== playRequest) return;

  widget.play();
}

function nextTrack() {
  if (!widget || !sounds.length) return;

  if (shuffleEnabled) {
    playTrack(randomIndex());
  } else {
    widget.next();
  }
}

function previousTrack() {
  if (!widget || !sounds.length) return;

  if (shuffleEnabled) {
    playTrack(randomIndex());
  } else {
    playTrack(Math.max(0, currentIndex - 1));
  }
}

function initializePlayer() {
  iframe.src = embedURL;
  widget = SC.Widget(iframe);

  widget.bind(SC.Widget.Events.READY, () => {
    widget.setVolume(Number(volumeEl.value));

    widget.getSounds(playlistSounds => {
      sounds = Array.isArray(playlistSounds)
        ? playlistSounds.filter(sound => sound && sound.id)
        : [];

      if (!sounds.length) {
        statusEl.textContent = "NO TRACKS AVAILABLE";
        countEl.textContent = "EMPTY";
        showMessage("No tracks available. Check playlist visibility and embedding permissions.");
        return;
      }

      renderTracklist();

      widget.getCurrentSoundIndex(index => {
        currentIndex = Number.isInteger(index) ? index : 0;
        renderTracklist();
      });

      widget.getCurrentSound(sound => {
        if (sound) updateCurrentTrack(sound);
      });

      statusEl.textContent = "PLAYLIST CONNECTED";
    });
  });

  widget.bind(SC.Widget.Events.PLAY, () => {
    updatePlayButton(true);
    widget.getCurrentSound(sound => {
      if (sound) updateCurrentTrack(sound);
    });
  });

  widget.bind(SC.Widget.Events.PAUSE, () => {
    updatePlayButton(false);
  });

  widget.bind(SC.Widget.Events.FINISH, () => {
    if (shuffleEnabled) playTrack(randomIndex());
  });
}

volumeEl.addEventListener("input", () => {
  if (widget) widget.setVolume(Number(volumeEl.value));
});

playBtn.addEventListener("click", () => {
  if (!widget) return;
  isPlaying ? widget.pause() : widget.play();
});

document.getElementById("next").addEventListener("click", nextTrack);
document.getElementById("previous").addEventListener("click", previousTrack);

shuffleBtn.addEventListener("click", () => {
  shuffleEnabled = !shuffleEnabled;
  shuffleBtn.classList.toggle("active", shuffleEnabled);
  shuffleBtn.setAttribute("aria-pressed", String(shuffleEnabled));
});

async function shareContent(data) {
  if (navigator.share) {
    try {
      await navigator.share(data);
      return;
    } catch (error) {
      if (error.name === "AbortError") return;
    }
  }

  try {
    await navigator.clipboard.writeText(data.url);
    alert("Link copied.");
  } catch {
    window.prompt("Copy this link:", data.url);
  }
}

document.getElementById("share-playlist").addEventListener("click", () => {
  shareContent({
    title: "DOOMED TUNES® powered by OjeeXa$h",
    url: SHARE_URL
  });
});

document.getElementById("share-track").addEventListener("click", () => {
  if (!widget) return;

  widget.getCurrentSound(sound => {
    if (!sound?.permalink_url) {
      alert("No track is currently selected.");
      return;
    }

    shareContent({
      title: sound.title || "DOOMED TUNES",
      text: sound.title ? "Listen to " + sound.title : "Listen to this track",
      url: sound.permalink_url
    });
  });
});

if (window.SC && window.SC.Widget) {
  initializePlayer();
} else {
  statusEl.textContent = "PLAYER UNAVAILABLE";
  countEl.textContent = "ERROR";
  showMessage("SoundCloud player could not be initialized. Please refresh the page.");
}
</script>
</body>
</html>
