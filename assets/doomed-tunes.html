
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOMED TUNES</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;margin:0;padding:0;background:transparent}
body{color:#d8d4e8;font:13px Arial,sans-serif}
#player{width:100%;max-width:340px;margin:30px auto;padding:10px}
.player-main{display:grid;grid-template-columns:40px 180px 40px;align-items:center;justify-content:center;gap:12px}
.cover-wrap{width:180px;height:180px;position:relative;overflow:hidden;background:#171421}
#cover{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#toggle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
#toggle svg{display:block;width:21px;height:21px;fill:currentColor}
.side-button{width:40px;height:40px;padding:0;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;cursor:pointer}
.side-button:hover{opacity:.65}
#track-title{width:100%;margin:14px auto 8px;text-align:center;font-size:12px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-area{width:100%}
#progress{display:block;width:100%;height:3px;margin:0;accent-color:#fff;cursor:pointer}
.time-row{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:#aaa}
.controls{display:flex;align-items:center;justify-content:center;margin-top:14px}
.right-controls{display:flex;align-items:center;justify-content:center;gap:16px}
#volume{width:90px;height:3px;accent-color:#fff;cursor:pointer}
.control-button{border:0;background:none;color:#fff;padding:3px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#shuffle{opacity:.55}
#shuffle.active{opacity:1}
#shuffle svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tracks{display:none}
#sc{position:fixed;top:0;left:0;width:100%;height:166px;opacity:0;pointer-events:none}
@media(max-width:360px){
 #player{max-width:320px}
 .player-main{grid-template-columns:32px minmax(0,180px) 32px;gap:8px}
 .cover-wrap{width:100%;height:auto;aspect-ratio:1}
 .side-button{width:32px}
}
</style>
</head>
<body>
<div id="player">
  <div class="player-main">
    <button class="side-button" id="prev" aria-label="Previous track">◀</button>
    <div class="cover-wrap">
      <img id="cover" alt="">
      <button id="toggle" aria-label="Play">
        <svg viewBox="0 0 24 24"><path d="M7 4.8v14.4L19 12 7 4.8z"/></svg>
      </button>
    </div>
    <button class="side-button" id="next" aria-label="Next track">▶</button>
  </div>
  <div id="track-title">DOOMED TUNES</div>
  <div class="progress-area">
    <input id="progress" type="range" min="0" max="100" value="0" aria-label="Track progress">
    <div class="time-row">
      <span id="current-time">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>
  <div class="controls">
    <div class="right-controls">
      <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume">
      <button class="control-button" id="shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="tracks"></div>
</div>
<iframe id="sc" allow="autoplay"></iframe>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(async () => {
const $ = id => document.getElementById(id);
const playlist = "https://soundcloud.com/ojeexash/sets/doomed-tunes-fm";
$("sc").src = "https://w.soundcloud.com/player/?url=" + encodeURIComponent(playlist) + "&auto_play=false&visual=false";
const widget = SC.Widget($("sc"));
const events = SC.Widget.Events;
let tracks = [], current = 0, ready = false, scanning = false, shuffle = false;
let duration = 0, seeking = false;

const playIcon = '<svg viewBox="0 0 24 24"><path d="M7 4.8v14.4L19 12 7 4.8z"/></svg>';
const pauseIcon = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

function setPlaybackIcon(playing) {
  $("toggle").innerHTML = playing ? pauseIcon : playIcon;
  $("toggle").setAttribute("aria-label",playing ? "Pause" : "Play");
}

const delay = ms => new Promise(resolve => setTimeout(resolve,ms));
const getSounds = () => new Promise(resolve => widget.getSounds(resolve));
const getIndex = () => new Promise(resolve => widget.getCurrentSoundIndex(resolve));
const getSound = () => new Promise(resolve => widget.getCurrentSound(resolve));
const getDuration = () => new Promise(resolve => widget.getDuration(resolve));

function formatTime(ms) {
  const seconds = Math.floor((ms || 0) / 1000);
  return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2,"0");
}

async function updateDuration() {
  duration = await getDuration() || 0;
  $("progress").max = duration || 100;
  $("progress").value = 0;
  $("duration").textContent = formatTime(duration);
  $("current-time").textContent = "0:00";
}

async function waitIndex(target) {
  for(let i=0;i<80;i++) {
    if(await getIndex() === target) return true;
    await delay(150);
  }
  return false;
}

async function readCurrentTrack() {
  for(let i=0;i<40;i++) {
    const sound = await getSound();
    if(sound && sound.title) return sound;
    await delay(250);
  }
  return null;
}

function render() {
  const list = $("tracks");
  list.replaceChildren();
  tracks.forEach((track,index) => {
    if(!track || !track.title) return;
    const button = document.createElement("button");
    button.className = "track" + (index === current ? " active" : "");
    button.textContent = track.title;
    button.onclick = () => play(index);
    list.append(button);
  });
}

function showTrack(track,index) {
  if(!track) return;
  current = index;
  $("track-title").textContent = track.title || "";
  if(track.artwork_url) $("cover").src = track.artwork_url.replace("-large","-t500x500");
  else $("cover").removeAttribute("src");
  updateDuration();
  render();
}

async function loadPlaylist() {
  if(scanning || ready) return;
  scanning = true;
  try {
    const sounds = await getSounds();
    if(!Array.isArray(sounds) || !sounds.length) {
      scanning = false;
      return;
    }
    const total = sounds.length;
    tracks = sounds.map(sound => sound && sound.title ? {...sound} : null);
    await widget.setVolume(0);
    widget.skip(0);
    if(!await waitIndex(0)) throw Error("Track selection failed");
    for(let i=0;i<total;i++) {
      const sound = await readCurrentTrack();
      if(sound && sound.title) {
        tracks[i] = {...(tracks[i] || {}),...sound};
        render();
      }
      if(i < total-1) {
        widget.next();
        if(!await waitIndex(i+1)) throw Error("Track change failed");
      }
    }
    widget.skip(0);
    if(!await waitIndex(0)) throw Error("Initial track selection failed");
    widget.pause();
    await widget.setVolume(+$("volume").value);
    current = 0;
    ready = true;
    scanning = false;
    if(tracks[0]) showTrack(tracks[0],0);
    setPlaybackIcon(false);
    render();
  } catch(error) {
    scanning = false;
    console.error(error);
  }
}

async function play(index) {
  if(!ready || index<0 || index>=tracks.length) return;
  widget.skip(index);
  if(!await waitIndex(index)) return;
  current = index;
  widget.seekTo(0);
  widget.play();
  const sound = await readCurrentTrack();
  if(sound) {
    tracks[index] = {...(tracks[index] || {}),...sound};
    showTrack(sound,index);
  }
}

async function changeTrack(direction) {
  if(!ready || !tracks.length) return;
  let index;
  if(shuffle && direction === 1 && tracks.length > 1) {
    do {
      index = Math.floor(Math.random() * tracks.length);
    } while(index === current);
  } else {
    index = (current + direction + tracks.length) % tracks.length;
  }
  await play(index);
}

$("toggle").onclick = () => {
  if(ready) widget.toggle();
};
$("prev").onclick = () => changeTrack(-1);
$("next").onclick = () => changeTrack(1);

widget.bind(events.READY,loadPlaylist);
widget.bind(events.PLAY,async () => {
  if(scanning) return;
  setPlaybackIcon(true);
  const index = await getIndex();
  const sound = await getSound();
  if(sound) showTrack(sound,index);
});
widget.bind(events.PAUSE,() => setPlaybackIcon(false));
widget.bind(events.PLAY_PROGRESS,data => {
  if(scanning || seeking) return;
  const position = data.currentPosition || 0;
  $("progress").value = position;
  $("current-time").textContent = formatTime(position);
});
widget.bind(events.FINISH,() => {
  if(ready) changeTrack(1);
});
$("progress").oninput = event => {
  if(!ready || !duration) return;
  seeking = true;
  const position = +event.target.value;
  $("current-time").textContent = formatTime(position);
  widget.seekTo(position);
};
$("progress").onchange = () => seeking = false;
$("volume").oninput = event => {
  if(ready) widget.setVolume(+event.target.value);
};
$("shuffle").onclick = () => {
  shuffle = !shuffle;
  $("shuffle").classList.toggle("active",shuffle);
};
})();
</script>
</body>
</html>
