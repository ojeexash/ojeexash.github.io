
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOMED TUNES</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;margin:0;padding:0;background:transparent}
body{color:#d8d4e8;font:14px Arial,sans-serif}
#player{width:100%;max-width:420px;margin:30px auto;padding:10px}
.player-main{display:grid;grid-template-columns:64px minmax(0,1fr) 76px;align-items:center;gap:12px;width:100%}
.cover-wrap{width:64px;height:64px;position:relative;overflow:hidden;border-radius:4px;background:#171421}
#cover{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}
#toggle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;padding:0;margin:0;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
#toggle span{display:block;line-height:1}
.track-info{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
#track-title{width:100%;color:#d8d4e8;font-size:12px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom-controls{display:flex;align-items:center;gap:10px;width:100%}
#volume{width:100%;min-width:0;height:3px;margin:0;accent-color:#fff;cursor:pointer}
#shuffle{flex:0 0 24px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:#fff;opacity:.55;cursor:pointer;padding:2px}
#shuffle.active{opacity:1}
#shuffle svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.transport{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:#fff;font-size:17px;cursor:pointer;padding:0}
.side-button:hover{opacity:.7}
#tracks{display:none}
#sc{position:fixed;top:0;left:0;width:100%;height:166px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="player">
  <div class="player-main">
    <div class="cover-wrap">
      <img id="cover" alt="">
      <button id="toggle" aria-label="Play or pause"><span>▶</span></button>
    </div>
    <div class="track-info">
      <div id="track-title"></div>
      <div class="bottom-controls">
        <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume">
        <button id="shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="transport">
      <button class="side-button" id="prev" aria-label="Previous track">◀</button>
      <button class="side-button" id="next" aria-label="Next track">▶</button>
    </div>
  </div>
  <div id="tracks"></div>
</div>
<iframe id="sc" allow="autoplay"></iframe>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(async () => {
const $ = id => document.getElementById(id);
const playlist = "https://soundcloud.com/ojeexash/sets/doomed-tunes-fm";
$("sc").src = "https://w.soundcloud.com/player/?url=" + encodeURIComponent(playlist) + "&auto_play=false&visual=false";
const widget = SC.Widget($("sc"));
const events = SC.Widget.Events;
let tracks = [], current = 0, ready = false, scanning = false, shuffle = false;
const delay = ms => new Promise(resolve => setTimeout(resolve,ms));
const getSounds = () => new Promise(resolve => widget.getSounds(resolve));
const getIndex = () => new Promise(resolve => widget.getCurrentSoundIndex(resolve));
const getSound = () => new Promise(resolve => widget.getCurrentSound(resolve));

async function waitIndex(target) {
  for(let i=0;i<80;i++) {
    if(await getIndex() === target) return true;
    await delay(150);
  }
  return false;
}

async function readCurrentTrack() {
  for(let i=0;i<40;i++) {
    const sound = await getSound();
    if(sound && sound.title) return sound;
    await delay(250);
  }
  return null;
}

function render() {
  const list = $("tracks");
  list.replaceChildren();
  tracks.forEach((track,index) => {
    if(!track || !track.title) return;
    const button = document.createElement("button");
    button.className = "track" + (index === current ? " active" : "");
    button.textContent = track.title;
    button.onclick = () => play(index);
    list.append(button);
  });
}

function showTrack(track,index) {
  if(!track) return;
  current = index;
  $("track-title").textContent = track.title || "";
  if(track.artwork_url) $("cover").src = track.artwork_url.replace("-large","-t500x500");
  else $("cover").removeAttribute("src");
  render();
}

async function loadPlaylist() {
  if(scanning || ready) return;
  scanning = true;
  try {
    const sounds = await getSounds();
    if(!Array.isArray(sounds) || !sounds.length) {
      scanning = false;
      return;
    }
    const total = sounds.length;
    tracks = sounds.map(sound => sound && sound.title ? {...sound} : null);
    await widget.setVolume(0);
    widget.skip(0);
    if(!await waitIndex(0)) throw Error("Track selection failed");
    for(let i=0;i<total;i++) {
      const sound = await readCurrentTrack();
      if(sound && sound.title) {
        tracks[i] = {...(tracks[i] || {}),...sound};
        render();
      }
      if(i < total-1) {
        widget.next();
        if(!await waitIndex(i+1)) throw Error("Track change failed");
      }
    }
    widget.skip(0);
    await waitIndex(0);
    widget.pause();
    await widget.setVolume(+$("volume").value);
    current = 0;
    if(tracks[0]) showTrack(tracks[0],0);
    ready = true;
    scanning = false;
    render();
  } catch(error) {
    scanning = false;
    console.error(error);
  }
}

async function play(index) {
  if(!ready || index<0 || index>=tracks.length) return;
  widget.skip(index);
  if(!await waitIndex(index)) return;
  current = index;
  widget.seekTo(0);
  widget.play();
  const sound = await readCurrentTrack();
  if(sound) {
    tracks[index] = {...(tracks[index] || {}),...sound};
    showTrack(sound,index);
  }
}

async function changeTrack(direction) {
  if(!ready || !tracks.length) return;
  let index;
  if(shuffle && direction === 1 && tracks.length > 1) {
    do {
      index = Math.floor(Math.random() * tracks.length);
    } while(index === current);
  } else {
    index = (current + direction + tracks.length) % tracks.length;
  }
  await play(index);
}

widget.bind(events.READY,loadPlaylist);
widget.bind(events.PLAY,async () => {
  $("toggle").querySelector("span").textContent = "Ⅱ";
  const index = await getIndex();
  const sound = await getSound();
  if(sound) showTrack(sound,index);
});
widget.bind(events.PAUSE,() => {
  $("toggle").querySelector("span").textContent = "▶";
});
widget.bind(events.FINISH,() => {
  if(ready) changeTrack(1);
});
$("toggle").onclick = () => {
  if(ready) widget.toggle();
};
$("prev").onclick = () => changeTrack(-1);
$("next").onclick = () => changeTrack(1);
$("volume").oninput = event => {
  if(ready) widget.setVolume(+event.target.value);
};
$("shuffle").onclick = () => {
  shuffle = !shuffle;
  $("shuffle").classList.toggle("active",shuffle);
};
})();
</script>
</body>
</html>
