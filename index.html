<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Ojee Ka$h</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- ICONS -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    ::selection{
      background:white;
      color:black;
    }

    body{

      background:
      radial-gradient(circle at top,
      #111 0%,
      #050505 30%,
      #000 70%);

      color:white;

      font-family:'Inter', sans-serif;

      overflow-x:hidden;

      position:relative;

      letter-spacing:0.5px;
    }

    /* NOISE / GRAIN */

    .noise{
      position:fixed;
      inset:0;

      pointer-events:none;

      opacity:0.12;

      z-index:999;

      background-image:
      url("https://grainy-gradients.vercel.app/noise.svg");

      mix-blend-mode:soft-light;

      animation:grain 0.3s steps(1) infinite;
    }

    @keyframes grain{

      0%{transform:translate(0,0)}

      20%{transform:translate(-2%,-3%)}

      40%{transform:translate(1%,2%)}

      60%{transform:translate(3%,1%)}

      80%{transform:translate(-1%,1%)}

      100%{transform:translate(0,0)}
    }

    /* BACKGROUND GLOW */

    body::before{
      content:'';

      position:fixed;

      width:700px;
      height:700px;

      background:
      radial-gradient(circle,
      rgba(255,255,255,0.06),
      transparent 70%);

      top:-250px;
      left:50%;

      transform:translateX(-50%);

      filter:blur(90px);

      z-index:-1;
    }

    .container{
      width:92%;
      max-width:850px;

      margin:auto;

      padding:90px 0;
    }

    /* HERO */

    .hero{
      text-align:center;
      margin-bottom:55px;
    }

    .artist-name{

      font-family:'Cinzel', serif;

      font-size:5.5rem;

      font-weight:800;

      letter-spacing:8px;

      text-transform:uppercase;

      color:#f5f5f5;

      text-shadow:
      0 0 6px rgba(255,255,255,0.08),
      0 0 30px rgba(255,255,255,0.04);

      position:relative;

      display:inline-block;
    }

    .artist-name::after{

      content:'';

      position:absolute;

      left:50%;
      bottom:-12px;

      width:120px;
      height:1px;

      background:
      rgba(255,255,255,0.15);

      transform:translateX(-50%);
    }

    /* SOCIALS */

    .socials{

      display:flex;

      justify-content:center;

      gap:24px;

      margin-bottom:80px;
    }

    .socials a{

      color:white;

      font-size:1.45rem;

      transition:0.35s ease;
    }

    .socials a:hover{

      transform:
      translateY(-4px)
      scale(1.08);

      color:#d0d0d0;

      opacity:0.9;
    }

    /* SECTION */

    .section{
      margin-bottom:75px;
    }

    .section h2{

      font-size:0.82rem;

      letter-spacing:6px;

      color:#7c7c7c;

      margin-bottom:24px;
    }

    /* RELEASE CARDS */

    .release-card{

      display:flex;

      gap:22px;

      margin-bottom:24px;

      padding:18px;

      background:
      linear-gradient(
      135deg,
      rgba(255,255,255,0.03),
      rgba(255,255,255,0.01)
      );

      border:
      1px solid rgba(255,255,255,0.06);

      backdrop-filter:blur(10px);

      transition:0.35s ease;

      overflow:hidden;

      box-shadow:
      0 0 40px rgba(255,255,255,0.02);
    }

    .release-card:hover{

      transform:
      translateY(-3px);

      border-color:
      rgba(255,255,255,0.18);

      box-shadow:
      0 0 50px rgba(255,255,255,0.05);
    }

    .release-card img{

      width:120px;
      height:120px;

      object-fit:cover;

      filter:
      grayscale(15%)
      contrast(1.05)
      brightness(0.82);

      transition:0.4s ease;
    }

    .release-card:hover img{

      transform:scale(1.03);

      filter:
      grayscale(0%)
      contrast(1.1)
      brightness(0.95);
    }

    .release-info{

      display:flex;

      flex-direction:column;

      justify-content:center;
    }

    .release-info h3{

      margin-bottom:15px;

      font-size:1.25rem;

      letter-spacing:2px;
    }

    /* PLATFORMS */

    .platforms{

      display:flex;

      gap:14px;

      flex-wrap:wrap;
    }

    .platforms a{

      color:#8d8d8d;

      text-decoration:none;

      font-size:0.9rem;

      transition:0.25s ease;
    }

    .platforms a:hover{

      color:white;

      transform:translateY(-1px);
    }

    /* ALBUMS */

    .album-card{

      position:relative;

      height:150px;

      overflow:hidden;

      margin-bottom:18px;

      background:#0a0a0a;

      border:
      1px solid rgba(255,255,255,0.06);

      transition:0.35s ease;
    }

    .album-card:hover{

      border-color:
      rgba(255,255,255,0.15);
    }

    .album-card img{

      width:100%;
      height:100%;

      object-fit:cover;

      filter:
      grayscale(15%)
      contrast(1.05)
      brightness(0.82);

      transition:0.4s ease;
    }

    .album-card:hover img{

      transform:scale(1.03);

      filter:
      grayscale(0%)
      contrast(1.08)
      brightness(0.92);
    }

    .album-info{

      position:absolute;

      left:0;
      bottom:0;

      width:100%;

      padding:20px;

      background:
      linear-gradient(
      transparent,
      rgba(0,0,0,0.92)
      );
    }

    .album-info h3{

      letter-spacing:2px;

      font-size:1rem;
    }

    /* LOCKED */

    .locked{

      display:flex;

      align-items:center;

      justify-content:center;

      background:
      linear-gradient(
      135deg,
      #050505,
      #111
      );

      opacity:0.45;
    }

    .locked-center{

      letter-spacing:3px;

      color:#999;

      font-size:0.92rem;
    }

    /* MOBILE */

    @media(max-width:700px){

      .artist-name{
        font-size:3.2rem;
        letter-spacing:5px;
      }

      .release-card{
        flex-direction:column;
      }

      .release-card img{
        width:100%;
        height:260px;
      }

      .socials{
        gap:18px;
        flex-wrap:wrap;
      }
    }

  </style>
</head>

</body>
