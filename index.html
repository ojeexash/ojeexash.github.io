<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Ojee Ka$h</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- UPDATED FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    ::selection{
      background:white;
      color:black;
    }

    body{
      background:#050505;
      color:white;
      font-family:'Inter', sans-serif;
      overflow-x:hidden;
      position:relative;
      letter-spacing:0.5px;
    }

    body::before{
      content:'';
      position:fixed;
      inset:0;
      pointer-events:none;
      background:radial-gradient(circle at top,
        rgba(255,255,255,0.05),
        transparent 45%);
      z-index:-2;
    }

    .noise{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:0.10;
      z-index:999;
      background-image:url("https://grainy-gradients.vercel.app/noise.svg");
      mix-blend-mode:soft-light;
      animation:grain 0.25s steps(1) infinite;
    }

    @keyframes grain{
      0%{transform:translate(0,0)}
      25%{transform:translate(-1%,-1%)}
      50%{transform:translate(1%,1%)}
      75%{transform:translate(-1%,1%)}
      100%{transform:translate(0,0)}
    }

    .container{
      width:92%;
      max-width:850px;
      margin:auto;
      padding:90px 0;
    }

    .hero{
      text-align:center;
      margin-bottom:55px;
    }

    .artist-name{
      font-family:'Bebas Neue', sans-serif;
      font-size:5.4rem;
      font-weight:400;
      letter-spacing:8px;
      text-transform:uppercase;
      color:#f5f5f5;
      text-shadow:0 0 12px rgba(255,255,255,0.06);
      position:relative;
      display:inline-block;
    }

    .artist-name::after{
      content:'';
      position:absolute;
      left:50%;
      bottom:-12px;
      width:120px;
      height:1px;
      background:rgba(255,255,255,0.15);
      transform:translateX(-50%);
    }

    .socials{
      display:flex;
      justify-content:center;
      gap:24px;
      margin-bottom:80px;
    }

    .socials a{
      color:white;
      font-size:1.45rem;
      transition:0.3s ease;
    }

    .socials a:hover{
      transform:translateY(-3px) scale(1.06);
      opacity:0.85;
    }

    .section{
      margin-bottom:75px;
    }

    .section h2{
      font-size:0.82rem;
      letter-spacing:6px;
      color:#7c7c7c;
      margin-bottom:24px;
    }

    .release-card{
      display:flex;
      gap:22px;
      margin-bottom:24px;
      padding:18px;
      background:rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.06);
      backdrop-filter:blur(10px);
      transition:0.3s ease;
    }

    .release-card:hover{
      transform:translateY(-3px);
      border-color:rgba(255,255,255,0.18);
    }

    .release-card img{
      width:120px;
      height:120px;
      object-fit:cover;
      filter:grayscale(10%) contrast(1.05) brightness(0.85);
    }

    .release-info{
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .release-info h3{
      margin-bottom:12px;
      font-size:1.2rem;
      letter-spacing:2px;
    }

    .platforms{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
    }

    .platforms a{
      color:#9a9a9a;
      text-decoration:none;
      font-size:0.9rem;
      transition:0.2s ease;
    }

    .platforms a:hover{
      color:white;
    }

    .album-card{
      position:relative;
      height:150px;
      overflow:hidden;
      margin-bottom:18px;
      background:#0a0a0a;
      border:1px solid rgba(255,255,255,0.06);
    }

    .album-card img{
      width:100%;
      height:100%;
      object-fit:cover;
      filter:grayscale(10%) brightness(0.85);
    }

    .album-info{
      position:absolute;
      left:0;
      bottom:0;
      width:100%;
      padding:18px;
      background:linear-gradient(transparent, rgba(0,0,0,0.9));
    }

    .locked{
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0.45;
      background:#080808;
    }

    .locked-center{
      letter-spacing:3px;
      color:#999;
      font-size:0.92rem;
    }

    @media(max-width:700px){

      .artist-name{
        font-size:3.2rem;
        letter-spacing:5px;
      }

      .release-card{
        flex-direction:column;
      }

      .release-card img{
        width:100%;
        height:260px;
      }
    }

  </style>
</head>

<body>

<div class="noise"></div>

            Spotify
          </a>

          </a>

      </div>

    </div>

    <!-- THOSE LIES -->

          <a href="https://open.spotify.com/intl-tr/album/2InDRMD7Y4JJ1tFaiKT9H4" target="_blank">

          </a>

          <a href="#" target="_blank">

      </div>

    </div>

  </section>

  <!-- ALBUMS -->
  <section class="section">

    <h2>WINGED DUSTOFF SERIE</h2>

    <div class="album-card">
      <img src="images/wdpt1.png">
      <div class="album-info">
        <h3>PT.1</h3>
      </div>
    </div>

    <div class="album-card locked">
      <div class="locked-center">PT.2 🔒</div>
    </div>

    <div class="album-card locked">
      <div class="locked-center">PT.3 🔒</div>
    </div>

    <div class="album-card locked">
      <div class="locked-center">PT.4 🔒</div>
    </div>

    <div class="album-card locked">
      <div class="locked-center">PT.5 🔒</div>

  </section>

</div>

</body>
</html>
