<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ojee Ka$h</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
background:#050505;
color:white;
font-family:'Inter',sans-serif;
letter-spacing:0.5px;
overflow-x:hidden;
}

/* GRAIN */
.noise{
position:fixed;
inset:0;
opacity:0.1;
pointer-events:none;
background:url("https://grainy-gradients.vercel.app/noise.svg");
mix-blend-mode:soft-light;
animation:grain 0.3s steps(1) infinite;
}

@keyframes grain{
0%{transform:translate(0,0)}
50%{transform:translate(1%,-1%)}
100%{transform:translate(0,0)}
}

/* HERO */
.hero{text-align:center;padding:70px 20px;}
.artist-name{
font-family:'Cinzel',serif;
font-size:4.5rem;
letter-spacing:6px;
}

/* SOCIAL */
.socials{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:50px;
}

.socials a{
color:white;
font-size:1.4rem;
}

/* SECTION */
.section{
width:90%;
max-width:800px;
margin:0 auto 60px;
}

h2{
font-size:0.8rem;
letter-spacing:5px;
color:#777;
margin-bottom:20px;
}

/* RELEASE */
.release-card{
display:flex;
gap:15px;
padding:15px;
border:1px solid #222;
margin-bottom:15px;
}

.release-card img{
width:110px;
height:110px;
object-fit:cover;
}

.release-info h3{
margin-bottom:10px;
}

.platforms{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.platforms a{
font-size:0.85rem;
color:#aaa;
text-decoration:none;
}

/* ALBUM */
.album-card{
border:1px solid #222;
margin-bottom:10px;
height:140px;
display:flex;
align-items:center;
justify-content:center;
}

.locked{opacity:0.4;}

.locked-center{letter-spacing:2px;}

</style>
</head>

<body>

<div class="noise"></div>

<div class="hero">
  <div class="artist-name">Ojee Ka$h</div>
</div>

<div class="socials">
<a href="#"><i class="fab fa-instagram"></i></a>
<a href="#"><i class="fab fa-spotify"></i></a>
<a href="#"><i class="fab fa-youtube"></i></a>
</div>

<!-- RELEASES -->
<section class="section">

<h2>LATEST RELEASES</h2>

<div class="release-card">
<img src="images/wdpt1.png">
<div class="release-info">
<h3>JEEP CALLIN'</h3>
<div class="platforms">

<a href="#">Apple Music</a>
<a href="#">YouTube Music</a>
<a href="#">Spotify</a>
<a href="#">Deezer</a>

</div>
</div>
</div>

<div class="release-card">
<img src="images/wdpt1.png">
<div class="release-info">
<h3>THOSE LIES</h3>
<div class="platforms">

<a href="#">Apple Music</a>
<a href="#">YouTube Music</a>
<a href="#">Spotify</a>
<a href="#">Deezer</a>

</div>
</div>
</div>

</section>

<!-- ALBUMS -->
<section class="section">

<h2>WINGED DUSTOFF SERIES</h2>

<div class="album-card">PT.1</div>
<div class="album-card locked"><div class="locked-center">PT.2 🔒</div></div>
<div class="album-card locked"><div class="locked-center">PT.3 🔒</div></div>
<div class="album-card locked"><div class="locked-center">PT.4 🔒</div></div>
<div class="album-card locked"><div class="locked-center">PT.5 🔒</div></div>

</section>

</body>
</html>
